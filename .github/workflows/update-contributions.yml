name: Update Halloween contributions

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-halloween-graph.mjs'
      - 'scripts/wrap-github-cards.mjs'
      - '.github/workflows/update-contributions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate calendar
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-halloween-graph.mjs

      - name: Wrap GitHub cards
        run: node scripts/wrap-github-cards.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp=$(date -u +%Y%m%d)
          sed -i "s|contributions.svg?v=[^\"']*|contributions.svg?v=${stamp}|" README.md
          sed -i "s|github-stats.svg?v=[^\"']*|github-stats.svg?v=${stamp}|" README.md
          sed -i "s|github-streak.svg?v=[^\"']*|github-streak.svg?v=${stamp}|" README.md
          sed -i "s|github-langs.svg?v=[^\"']*|github-langs.svg?v=${stamp}|" README.md
          git add assets/contributions.svg assets/github-stats.svg assets/github-streak.svg assets/github-langs.svg README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update Halloween calendar and GitHub cards"
          git push
